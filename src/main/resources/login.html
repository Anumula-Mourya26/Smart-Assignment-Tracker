<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Assignment Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="index.html">Smart Assignment Tracker</a>
            <nav>
                <a href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="container auth-container">
        <section class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Login</h1>
            <p class="auth-intro">Enter your account details to open your dashboard.</p>

            <form id="loginForm" novalidate>
                <label for="loginGmail">Gmail</label>
                <input id="loginGmail" name="gmail" type="email" autocomplete="email" placeholder="name@gmail.com" required>

                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>

                <button class="button primary full-width" type="submit">Login</button>
            </form>

            <p class="auth-switch">New user? <a href="register.html">Register here</a></p>
            <div id="message" class="message" role="alert" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
