<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Assignment Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="index.html">Smart Assignment Tracker</a>
            <nav>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <main class="container auth-container">
        <section class="auth-card">
            <p class="eyebrow">Create account</p>
            <h1>Register</h1>
            <p class="auth-intro">Use your Gmail address as your account username.</p>

            <form id="registerForm" novalidate>
                <label for="gmail">Gmail</label>
                <input id="gmail" name="gmail" type="email" autocomplete="email" placeholder="name@gmail.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

                <button class="button primary full-width" type="submit">Register</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
            <div id="message" class="message" role="alert" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
